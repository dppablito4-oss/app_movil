<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Copiadora Grafiplot - Redireccionando...</title>
  <script>
    (function() {
      var l = window.location;
      var path = l.pathname;
      var basePath = path.startsWith('/app_movil') ? '/app_movil' : '';
      var subPath = path.replace(/^\/app_movil/, '');
      var segments = subPath.split('/').filter(Boolean);
      
      if (segments.length >= 2 && segments[0] === 't') {
        var token = segments[1];
        sessionStorage.setItem('redirect_t', token);
        l.replace(l.protocol + '//' + l.host + basePath + '/?t=' + encodeURIComponent(token));
      } else if (segments.length >= 1 && segments[0].toLowerCase() === 'login') {
        l.replace(l.protocol + '//' + l.host + basePath + '/#login');
      } else {
        l.replace(l.protocol + '//' + l.host + basePath + '/');
      }
    })();
  </script>
</head>
<body>
  <div style="font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; background: #060912; color: #F7F9FC; text-align: center;">
    <div>
      <h2 style="margin-bottom: 8px;">Redireccionando...</h2>
      <p style="color: #768399;">Por favor espera un momento.</p>
    </div>
  </div>
</body>
</html>
